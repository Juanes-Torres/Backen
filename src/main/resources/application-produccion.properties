# =========================================================
# KAIRÓS - Ambiente PRODUCCIÓN (versión final)
# No hay valores por defecto: todo sale de variables de entorno.
# Si falta alguna, la aplicación NO arranca (así nunca corre con claves de prueba).
# Variables obligatorias: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET,
#                         CORS_ORIGINS, ADMIN_EMAIL, ADMIN_PASSWORD
# =========================================================

# ===== Base de datos =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# ===== JWT =====
jwt.secret=${JWT_SECRET}

# ===== CORS: dirección del frontend de producción =====
kairos.cors.allowed-origins=${CORS_ORIGINS}

# ===== Administrador inicial =====
kairos.admin.email=${ADMIN_EMAIL}
kairos.admin.password=${ADMIN_PASSWORD}
