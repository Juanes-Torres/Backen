# =========================================================
# KAIRÓS - Configuración COMÚN a todos los ambientes
# Lo propio de cada ambiente está en application-<perfil>.properties:
#   desarrollo      -> tu computadora (perfil por defecto)
#   pre-produccion  -> pruebas antes de publicar
#   produccion      -> versión final
# Elegir perfil: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=produccion
#            o la variable de entorno SPRING_PROFILES_ACTIVE=produccion
# 12 factores (III): lo que cambia entre ambientes sale de variables de entorno.
# Ver docs/12-factores-y-solid.md
# =========================================================

# Si no se indica perfil, se usa desarrollo
spring.profiles.default=desarrollo

# ===== Base de datos =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Puerto donde arranca el backend (variable SERVER_PORT; por defecto 8080)  [12 factores: VII]
server.port=${SERVER_PORT:8080}

# Al apagar, termina las peticiones en curso antes de cerrar (máx. 20 s)  [12 factores: IX]
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ===== JWT =====
# Duración del token: 1 hora por defecto (variable JWT_EXPIRATION_MS)
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== APIs externas (públicas, sin clave)  [12 factores: III y IV] =====
# Tiempo máximo de espera de cada llamada: si la API tarda más, se responde 503
kairos.apis.timeout-ms=${APIS_TIMEOUT_MS:5000}
# Códigos de barras: UPCitemdb (plan gratis: 100 consultas al día)
kairos.apis.codigo-barras.url=${CODIGO_BARRAS_API_URL:https://api.upcitemdb.com}

# ===== Correo (servidor SMTP de Gmail) =====
# Apagado por defecto: la app funciona sin credenciales y solo lo anota en el log.
kairos.mail.enabled=${MAIL_ENABLED:false}
kairos.mail.from-name=KAIRÓS
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
