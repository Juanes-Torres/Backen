# ===== Base de datos =====
spring.datasource.url=jdbc:postgresql://localhost:5432/kairos_db
spring.datasource.username=kairos
spring.datasource.password=${DB_PASSWORD:kairos123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080

# ===== JWT =====
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-32-caracteres-min}
jwt.expiration-ms=3600000

# ===== CORS: direcciones del frontend que pueden llamar a la API =====
kairos.cors.allowed-origins=http://localhost:5173

# ===== Administrador inicial (se crea al arrancar si no existe) =====
kairos.admin.email=${ADMIN_EMAIL:admin@kairos.com}
kairos.admin.password=${ADMIN_PASSWORD:Admin123*}
