# =========================================================
# KAIRÓS - Ambiente DESARROLLO (tu computadora)
# Tiene valores por defecto para trabajar sin configurar nada.
# Estos valores son SOLO para desarrollo local.
# =========================================================

# ===== Base de datos local =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kairos_db}
spring.datasource.username=${DB_USERNAME:kairos}
spring.datasource.password=${DB_PASSWORD:kairos123}

# Muestra en consola el SQL que ejecuta Hibernate (útil para aprender y depurar)
spring.jpa.show-sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-32-caracteres-min}

# ===== CORS: frontend local (Vite) =====
kairos.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ===== Administrador inicial (se crea al arrancar si no existe) =====
kairos.admin.email=${ADMIN_EMAIL:admin@kairos.com}
kairos.admin.password=${ADMIN_PASSWORD:Admin123*}
