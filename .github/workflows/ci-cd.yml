# =========================================================
# KAIRÓS backend - CI/CD en GitHub Actions (12 factores: V y X)
#
# CI (integración continua) - en cada Pull Request y cada push a desarrollo,
# pre-produccion y produccion:
#   1. levanta PostgreSQL 18 (la misma versión que en desarrollo y en Docker)
#   2. corre "./mvnw verify": todas las pruebas (unitarias y de integración)
#      y la regla de JaCoCo que exige mínimo 80 % de cobertura
#   3. escribe en el resumen cuántas pruebas pasaron y la cobertura
#   4. guarda el reporte de cobertura (y el de pruebas si algo falla)
#
# CD (entrega continua) - SOLO si el CI pasó y fue un push a pre-produccion o produccion:
#   5. construye la imagen de Docker con el Dockerfile del repositorio
#   6. la publica en GitHub Container Registry: ghcr.io/juanes-torres/kairos-backend
#      con la etiqueta del ambiente (:pre-produccion o :produccion) y la del commit
#   7. en produccion además le pone número de versión (v2026.11.17-12), la etiqueta
#      :latest y crea una Release en GitHub con los cambios
#
# Si algo falla, el PR muestra una X roja y NO se publica ninguna imagen.
# Ver docs/ci-cd.md
# =========================================================
name: CI/CD backend

on:
  pull_request:
    branches: [desarrollo, pre-produccion, produccion]
  push:
    branches: [desarrollo, pre-produccion, produccion]
  workflow_dispatch:          # también se puede correr a mano desde la pestaña Actions

# Si llega un commit nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kairos_db
          POSTGRES_USER: kairos
          # Base de datos desechable: existe solo mientras corren las pruebas
          POSTGRES_PASSWORD: kairos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Perfil desarrollo: el correo queda apagado (no hay secrets.properties) y las APIs externas
      # se simulan en las pruebas, así que no se necesita ningún secreto
      SPRING_PROFILES_ACTIVE: desarrollo
      DB_URL: jdbc:postgresql://localhost:5432/kairos_db
      DB_USERNAME: kairos
      DB_PASSWORD: kairos_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven        # guarda las dependencias: las siguientes ejecuciones son más rápidas

      - name: Pruebas y cobertura mínima (mvnw verify)
        run: ./mvnw -B verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: |
          pruebas=0; fallas=0
          for f in target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            e=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            r=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            pruebas=$((pruebas + t)); fallas=$((fallas + e + r))
          done
          {
            echo "## Pruebas del backend"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pruebas | $pruebas |"
            echo "| Fallidas | $fallas |"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              # Columnas 8 y 9 de jacoco.csv: líneas sin cubrir y cubiertas
              awk -F, 'NR>1 { m+=$8; c+=$9 } END { printf "| Cobertura de líneas | %.1f %% (mínimo 80 %%) |\n", 100*c/(c+m) }' target/site/jacoco/jacoco.csv
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar reporte de pruebas (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: target/surefire-reports/
          retention-days: 14

  # ---------------------------------------------------------
  # CD: publicar la imagen de Docker (solo pre-produccion y produccion)
  # ---------------------------------------------------------
  imagen:
    name: Publicar imagen Docker
    needs: pruebas            # espera al CI: si las pruebas fallan, no se publica nada
    if: github.event_name == 'push' && (github.ref_name == 'pre-produccion' || github.ref_name == 'produccion')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un ambiente de GitHub por rama: en la pestaña "Deployments" queda el historial
    environment: ${{ github.ref_name }}
    permissions:
      contents: write         # para crear la Release (solo en produccion)
      packages: write         # para subir la imagen a GitHub Container Registry

    env:
      IMAGEN: ghcr.io/juanes-torres/kairos-backend

    steps:
      - uses: actions/checkout@v5

      - name: Número de versión
        id: version
        # Versión por fecha (hora de Colombia) + número de ejecución: v2026.11.17-12
        run: echo "valor=v$(TZ=America/Bogota date +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Etiquetas de la imagen
        id: etiquetas
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.valor }},enable=${{ github.ref_name == 'produccion' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'produccion' }}

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Clave temporal que GitHub crea para esta ejecución: no hay que guardar ningún secreto
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.etiquetas.outputs.tags }}
          labels: ${{ steps.etiquetas.outputs.labels }}
          # Reutiliza las capas de la ejecución anterior (más rápido)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear la Release (solo produccion)
        if: github.ref_name == 'produccion'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          # --generate-notes agrega la lista de Pull Requests que entraron desde la versión anterior
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "KAIRÓS backend $VERSION" \
            --notes "Imagen de Docker: \`docker pull $IMAGEN:$VERSION\`" --generate-notes

      - name: Resumen de la entrega
        run: |
          {
            echo "## Imagen publicada (${{ github.ref_name }})"
            echo ""
            echo "${{ steps.etiquetas.outputs.tags }}" | sed 's/^/- `/; s/$/`/'
            echo ""
            echo "Para usarla: \`docker pull ${{ env.IMAGEN }}:${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
